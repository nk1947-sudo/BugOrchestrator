name: bugorchestrator

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bugorchestrator}
      POSTGRES_USER: ${POSTGRES_USER:-bugorchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Host-side port only - container-to-container traffic always uses
      # postgres:5432 internally. Mapped to 5433 so this doesn't collide
      # with a locally installed Postgres already bound to 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugorchestrator} -d ${POSTGRES_DB:-bugorchestrator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bugorchestrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bugorchestrator}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./workspace:/workspace

  scan-worker:
    build:
      context: ./services/scan-worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SCAN_WORKER_PORT:-8090}:8090"
    volumes:
      - ./workspace:/workspace

  orchestrator:
    build:
      context: ./services/orchestrator
    restart: unless-stopped
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
      SCAN_WORKER_INTERNAL_URL: http://scan-worker:8090
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
      - scan-worker
    volumes:
      - ./workspace:/workspace

  dashboard:
    build:
      context: ./apps/dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HOST_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
